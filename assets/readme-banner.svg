<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Watchdo</title><desc id="d">A file change triggers a command rerun in a compact terminal.</desc><defs><linearGradient id="bg"><stop stop-color="#18283d"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect x="110" y="90" width="980" height="145" rx="14" fill="#080f1b" stroke="#405873" stroke-width="2"/><circle cx="140" cy="115" r="6" fill="#ff9e8e"/><circle cx="162" cy="115" r="6" fill="#ffc77a"/><circle cx="184" cy="115" r="6" fill="#62e3c1"/><g fill="#edf3ff" font-family="monospace" font-size="18"><text x="150" y="165">$ watchdo ./src</text><text x="150" y="205" fill="#62e3c1">change detected — running command...</text></g><circle cx="990" cy="195" r="11" fill="#62e3c1"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/></circle><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">WATCHDO</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">WATCH / DETECT / RERUN</text></svg>