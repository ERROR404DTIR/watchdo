<text x="245" y="137" fill="#f0f5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="750">watchdo</text><text x="249" y="184" fill="#a8bad2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">File changes in. Fresh command run out.</text><g fill="#55d6be"><circle cx="900" cy="150" r="7"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="1010" cy="72" r="6"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="1088" cy="150" r="7"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" begin=".6s" repeatCount="indefinite"/></circle></g><text x="900" y="265" fill="#7187a5" font-family="monospace" font-size="17">WATCH · DEBOUNCE · RUN</text></svg>